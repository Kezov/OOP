[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostvoice"
version = "0.1.0"
description = "Ghostly reverse-reverb voice filter for Discord"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "sounddevice", "soundfile"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ghostvoice = "ghostvoice.cli:main"

[tool.setuptools]
packages = ["ghostvoice"]
